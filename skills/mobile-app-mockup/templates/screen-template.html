<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Name - App Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --color-primary: #007AFF;
      --color-primary-light: #E8F2FF;
      --color-secondary: #5856D6;
      --color-bg: #F2F2F7;
      --color-card: #FFFFFF;
      --color-text-primary: #000000;
      --color-text-secondary: #8E8E93;
      --color-text-tertiary: #C7C7CC;
      --color-separator: #E5E5EA;
      --color-danger: #FF3B30;
      --color-success: #34C759;
      --color-warning: #FF9500;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* iPhone 15 Pro Frame */
    .iphone-frame {
      width: 393px;
      height: 852px;
      background: var(--color-bg);
      border-radius: 44px;
      border: 3px solid #1a1a1a;
      box-shadow:
        0 0 0 2px #2a2a2a,
        0 0 0 4px #1a1a1a,
        0 20px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* === iOS Status Bar === */
    .status-bar {
      height: 54px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 24px 8px;
      flex-shrink: 0;
      position: relative;
      z-index: 100;
    }

    .status-bar .time {
      font-size: 15px;
      font-weight: 600;
      color: #000;
      width: 54px;
      text-align: center;
    }

    .status-bar .dynamic-island {
      width: 126px;
      height: 34px;
      background: #000;
      border-radius: 20px;
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
    }

    .status-bar .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #000;
      width: 54px;
      justify-content: flex-end;
    }

    .status-bar .status-icons i { font-size: 11px; }

    /* === Page Content Area === */
    .content-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .content-area::-webkit-scrollbar { display: none; }

    /* Hide tab bar spacer by default */
    .tab-bar-spacer { display: none; }

    /* === Bottom Tab Bar === */
    .tab-bar {
      height: 84px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 0.5px solid var(--color-separator);
      display: flex;
      align-items: flex-start;
      justify-content: space-around;
      padding-top: 6px;
      flex-shrink: 0;
    }

    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--color-text-secondary);
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
      min-width: 60px;
      padding: 0 4px;
    }

    .tab-item i { font-size: 22px; }
    .tab-item .tab-label { font-size: 11px; font-weight: 500; }
    .tab-item.active { color: var(--color-primary); }

    /* === Common Reusable Styles === */

    /* Section header */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 16px 8px;
    }
    .section-title { font-size: 20px; font-weight: 600; color: var(--color-text-primary); }
    .section-more { font-size: 15px; color: var(--color-primary); text-decoration: none; }

    /* Card */
    .card {
      background: var(--color-card);
      border-radius: 12px;
      overflow: hidden;
    }

    /* Primary button */
    .btn-primary {
      background: var(--color-primary);
      color: white;
      border: none;
      border-radius: 12px;
      height: 48px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* Secondary button */
    .btn-secondary {
      background: transparent;
      color: var(--color-primary);
      border: 1px solid var(--color-primary);
      border-radius: 12px;
      height: 48px;
      font-size: 17px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* Input field */
    .input-field {
      background: #F2F2F7;
      border: none;
      border-radius: 10px;
      height: 44px;
      padding: 0 16px;
      font-size: 17px;
      color: var(--color-text-primary);
      width: 100%;
      outline: none;
    }
    .input-field::placeholder { color: var(--color-text-tertiary); }

    /* Search bar */
    .search-bar {
      display: flex;
      align-items: center;
      background: #E5E5EA;
      border-radius: 10px;
      height: 36px;
      padding: 0 12px;
      gap: 6px;
      color: var(--color-text-secondary);
      font-size: 15px;
    }

    /* Avatar */
    .avatar-sm { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .avatar-md { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
    .avatar-lg { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }

    /* Badge */
    .badge {
      background: var(--color-danger);
      color: white;
      font-size: 10px;
      font-weight: 600;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }

    /* Divider */
    .divider {
      height: 0.5px;
      background: var(--color-separator);
      margin: 0 16px;
    }

    /* Navigation bar (for secondary pages) */
    .nav-bar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      flex-shrink: 0;
      position: relative;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(20px);
    }
    .nav-bar .nav-back {
      position: absolute;
      left: 16px;
      color: var(--color-primary);
      font-size: 17px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .nav-bar .nav-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--color-text-primary);
    }

    /* Tag / Chip */
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      background: #E8F2FF;
      color: var(--color-primary);
    }
  </style>
</head>
<body>
  <div class="iphone-frame">

    <!-- Status Bar -->
    <div class="status-bar">
      <span class="time">9:41</span>
      <div class="dynamic-island"></div>
      <div class="status-icons">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full"></i>
      </div>
    </div>

    <!-- Content Area - replace this with actual page content -->
    <div class="content-area" style="padding: 16px;">
      <!--
        PAGE CONTENT GOES HERE.
        Use Tailwind utility classes and the CSS variables defined above.
        Common patterns:
        - Cards with images
        - Horizontal scroll sections
        - Vertical lists
        - Search bars at top
        - Category grids
        - Banner/hero images
        For real images, use: https://images.unsplash.com/photo-{id}?w=400&h=400&fit=crop
        For avatars, use: https://ui-avatars.com/api/?name=Name&background=random&size=100
      -->
      <p style="color: var(--color-text-secondary); text-align: center; padding: 40px 0;">
        Replace this content with actual page design
      </p>
    </div>

    <!-- Bottom Tab Bar -->
    <!--
      Uncomment and customize for tab bar pages.
      For secondary/detail pages without tab bar, remove this section.
    -->
    <div class="tab-bar">
      <div class="tab-item active">
        <i class="fa-solid fa-house"></i>
        <span class="tab-label">首页</span>
      </div>
      <div class="tab-item">
        <i class="fa-solid fa-compass"></i>
        <span class="tab-label">发现</span>
      </div>
      <div class="tab-item">
        <i class="fa-solid fa-plus-square"></i>
        <span class="tab-label">发布</span>
      </div>
      <div class="tab-item">
        <i class="fa-solid fa-comment"></i>
        <span class="tab-label">消息</span>
      </div>
      <div class="tab-item">
        <i class="fa-solid fa-user"></i>
        <span class="tab-label">我的</span>
      </div>
    </div>

  </div>
</body>
</html>
