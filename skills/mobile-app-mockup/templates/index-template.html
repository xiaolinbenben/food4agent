<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Prototype - All Screens</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      min-height: 100vh;
      padding: 40px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .page-header h1 {
      font-size: 36px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .page-header p {
      font-size: 17px;
      color: rgba(255, 255, 255, 0.6);
    }

    .page-header .app-meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 16px;
    }

    .page-header .app-meta .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    /* Grid layout for screens */
    .screens-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 48px;
      justify-content: center;
      align-items: flex-start;
    }

    /* Each screen item */
    .screen-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      transition: transform 0.3s ease;
    }

    .screen-item:hover {
      transform: translateY(-8px);
    }

    .screen-item .screen-label {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.8);
      text-transform: capitalize;
    }

    .screen-item .screen-badge {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 10px;
      border-radius: 12px;
    }

    /* iPhone frame around iframe */
    .iframe-wrapper {
      position: relative;
      width: 399px;
      height: 858px;
      border-radius: 44px;
      border: 3px solid #2a2a2a;
      box-shadow:
        0 0 0 2px #3a3a3a,
        0 0 0 4px #1a1a1a,
        0 20px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      background: #000;
    }

    .iframe-wrapper iframe {
      width: 393px;
      height: 852px;
      border: none;
      display: block;
    }

    /* Tab page indicator */
    .screen-item.tab-page .screen-label::after {
      content: " ●";
      color: #34C759;
      font-size: 10px;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .screens-grid {
        gap: 32px;
      }
      .iframe-wrapper {
        width: 320px;
        height: 694px;
        border-radius: 36px;
      }
      .iframe-wrapper iframe {
        width: 314px;
        height: 688px;
      }
    }

    @media (max-width: 500px) {
      body { padding: 20px; }
      .iframe-wrapper {
        width: 280px;
        height: 608px;
        border-radius: 32px;
      }
      .iframe-wrapper iframe {
        width: 274px;
        height: 602px;
      }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1>📱 App Name Prototype</h1>
    <p>High-Fidelity Mobile App Mockup - iPhone 15 Pro</p>
    <div class="app-meta">
      <span><span class="color-dot" style="background: #007AFF;"></span> Primary: #007AFF</span>
      <span style="color: rgba(255,255,255,0.5);">|</span>
      <span style="color: rgba(255,255,255,0.6);">5 Screens</span>
    </div>
  </div>

  <div class="screens-grid">

    <!-- Replace these iframe items with actual generated screens -->
    <!--
      For each generated screen page, add:
      <div class="screen-item [tab-page]">
        <div class="iframe-wrapper">
          <iframe src="screens/page-name.html"></iframe>
        </div>
        <span class="screen-label">Page Name</span>
        <span class="screen-badge">Tab 主页</span>
      </div>

      Tab 主页: add class "tab-page" to screen-item
      二级页面: use "二级页面" as screen-badge text
    -->

    <div class="screen-item tab-page">
      <div class="iframe-wrapper">
        <iframe src="screens/home.html"></iframe>
      </div>
      <span class="screen-label">首页</span>
      <span class="screen-badge">Tab 主页</span>
    </div>

    <div class="screen-item">
      <div class="iframe-wrapper">
        <iframe src="screens/detail.html"></iframe>
      </div>
      <span class="screen-label">详情页</span>
      <span class="screen-badge">二级页面</span>
    </div>

    <!-- Add more screen items as needed -->

  </div>
</body>
</html>
